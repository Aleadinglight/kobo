name: Build KoboRoot.tgz

on:
  push:
    branches: [main]
    paths: [sources/**, scripts/**, vendor/**, build.py, .github/workflows/build.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python build.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: KoboRoot
          path: build/KoboRoot.tgz

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KoboRoot
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" KoboRoot.tgz \
            --repo "${{ github.repository }}" \
            --title "Vietnamese Kobo UI fonts (build ${{ github.run_number }})" \
            --notes-file docs/INSTALL.md
