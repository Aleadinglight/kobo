name: Build KoboRoot.tgz

on:
  push:
    branches: [main]
    paths: [sources/**, scripts/**, vendor/**, build.py, docs/INSTALL.md, .github/workflows/build.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: KoboRoot
          path: build/KoboRoot.tgz
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep a single release: remove all old ones (and their tags) first.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            xargs -r -n1 gh release delete --yes --cleanup-tag
          gh release create latest build/KoboRoot.tgz \
            --title "Latest" \
            --notes-file docs/INSTALL.md
